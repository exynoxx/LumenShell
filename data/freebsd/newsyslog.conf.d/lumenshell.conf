# newsyslog(8) drop-in: rotate /var/log/lumenshell.log at 1 MB, keep 5,
# compress, and create it (C) so syslogd has a file to write to.
# Install as /usr/local/etc/newsyslog.conf.d/lumenshell.conf.
# logfilename          [owner:group]    mode count size when  flags
/var/log/lumenshell.log                 644  5     1000 *     JC
