# syslogd(8) drop-in: LumenShell's autostarted binaries log through daemon(8)
# (`daemon -T lumen-panel lumen-panel`), tagged with their own names. Install
# as /usr/local/etc/syslog.d/lumenshell.conf, then `service syslogd reload`.
!lumen-session,lumen-polkit-agent,lumen-notifications,lumen-panel,lumen-drawer,lumen-osd,lumen-search,lumen-lockscreen
*.*							/var/log/lumenshell.log
!*
