# Reference snippet, not a standalone config: merge these blocks into
# ~/.config/wayfire.ini, e.g. `cat /usr/share/lumenshell/wayfire.ini.d/autostart.ini >> ~/.config/wayfire.ini`.

[core]
# Append `autostart` to your existing plugin list rather than overwriting it.
# Example (uncomment + edit to match your current value):
# plugins = alpha animate autostart command cube expo fast-switcher fisheye \
#           grid idle invert move oswitch place resize switcher vswitch \
#           window-rules wm-actions wobbly zoom

[autostart]
# MUST run first: its session bootstrap is what lets xdg-desktop-portal activate
# (else libadwaita apps render light and ScreenCast is dead).
session_daemon = lumen-session
# Without a polkit agent every privileged action fails silently. Harmless if
# the binary wasn't built.
polkit_agent  = lumen-polkit-agent
notifications = lumen-notifications
panel         = lumen-panel
drawer        = lumen-drawer
desktop       = lumen-desktop
osd           = lumen-osd
# Built-in idle lock; no swayidle needed. Harmless if the binary wasn't built.
lockscreen    = lumen-lockscreen

# Optional extras — uncomment to enable.
# background    = swaybg -i /path/to/wallpaper.jpg -m fill
# nm_applet     = nm-applet --indicator

# Needs the `command` plugin in [core] plugins.
[command]
# Win+P display picker: tap P to cycle, release Super to apply, Escape cancels.
binding_display_mode  = <super> KEY_P
command_display_mode  = lumen-osdctl --display-picker

# Win+L — lock the session (needs lumen-lockscreen running; see [autostart]).
binding_lock          = <super> KEY_L
command_lock          = lumen-lockctl lock
#
# Prefer plain press-to-cycle (no picker) instead? Use:
# command_display_mode  = lumen-osdctl --display-mode cycle

# Volume / brightness / mic — media keys driving the OSD. Uncomment to enable.
# binding_volume_raise  = KEY_VOLUMEUP
# command_volume_raise  = lumen-osdctl --output-volume raise
# binding_volume_lower  = KEY_VOLUMEDOWN
# command_volume_lower  = lumen-osdctl --output-volume lower
# binding_volume_mute   = KEY_MUTE
# command_volume_mute   = lumen-osdctl --output-volume mute-toggle
# binding_mic_mute      = KEY_MICMUTE
# command_mic_mute      = lumen-osdctl --input-volume mute-toggle
# binding_brightness_up = KEY_BRIGHTNESSUP
# command_brightness_up = lumen-osdctl --brightness raise
# binding_brightness_dn = KEY_BRIGHTNESSDOWN
# command_brightness_dn = lumen-osdctl --brightness lower
